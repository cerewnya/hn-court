name: daily-case

# Gate for the daily data-only case PRs opened by the Devin bot (branches
# named case/YYYY-MM-DD), and for every other push / PR to main.
#   1. path-lock guard  — case/* branches may only touch content/cases/*.json
#   2. type check       — npx tsc --noEmit
#   3. verification     — npx playwright test (Zod schema, DAG solver, layout, gameplay)

on:
  pull_request:
  push:
    branches: [main, "case/**"]
  workflow_dispatch:

concurrency:
  group: daily-case-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  path-lock:
    name: Path-lock guard (case/* branches)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Only content/cases/*.json may change on case/* branches
        env:
          HEAD_REF: ${{ github.head_ref || github.ref_name }}
          BASE_REF: ${{ github.base_ref || 'main' }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$HEAD_REF" in
            case/*) ;;
            *) echo "Branch '$HEAD_REF' is not a case/* branch; path lock not applicable."; exit 0 ;;
          esac

          if git rev-parse --verify --quiet "origin/$BASE_REF" >/dev/null; then
            BASE="$(git merge-base "origin/$BASE_REF" HEAD)"
          elif [ -n "${BEFORE_SHA:-}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            BASE="$BEFORE_SHA"
          else
            BASE="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi

          echo "Comparing $BASE..HEAD on $HEAD_REF"
          # --no-renames so a rename reports both the old and new path.
          CHANGED="$(git diff --name-only --no-renames "$BASE" HEAD)"
          if [ -z "$CHANGED" ]; then
            echo "No changed files."
            exit 0
          fi
          echo "$CHANGED" | sed 's/^/  changed: /'

          VIOLATIONS="$(echo "$CHANGED" | grep -Ev '^content/cases/[^/]+\.json$' || true)"
          if [ -n "$VIOLATIONS" ]; then
            echo "::error::case/* branches are data-only. These files are outside content/cases/*.json:"
            echo "$VIOLATIONS" | while read -r file; do echo "::error file=$file::not allowed on a case/* branch"; done
            exit 1
          fi
          echo "Path lock OK: only content/cases/*.json changed."

  verify:
    name: Type check + Playwright verification
    needs: path-lock
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Next.js route types
        run: npx next typegen

      - name: Type check
        run: npx tsc --noEmit

      - name: Validate cases (schema + DAG solver)
        run: npx tsx scripts/compile-case.ts --validate

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
